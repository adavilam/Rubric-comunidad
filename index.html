<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubricApp Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #0038a8; --brand-dark: #002a7a; --brand-light: #e0e7ff;
            --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
            --slate-700: #334155; --slate-900: #0f172a;
            --emerald: #10b981; --amber: #f59e0b; --rose: #ef4444;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Figtree', sans-serif; background: var(--slate-100); color: var(--slate-700); }

        /* PANTALLA SETUP */
        .setup-screen { max-width: 800px; margin: 50px auto; padding: 20px; }
        .card { background: white; border-radius: var(--radius); padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--slate-200); }
        .form-input { width: 100%; padding: 12px; border: 1px solid var(--slate-200); border-radius: 8px; margin-top: 8px; font-family: inherit; }
        textarea.form-input { min-height: 120px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        .btn-main { background: var(--brand); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn-main:hover { background: var(--brand-dark); transform: translateY(-2px); }

        /* DASHBOARD LAYOUT */
        .rubric-screen { display: none; }
        .app-shell { display: grid; grid-template-columns: 1fr 340px; min-height: 100vh; }
        
        .main-panel { padding: 40px; background: white; overflow-y: auto; }
        .sidebar { background: var(--slate-900); color: white; padding: 30px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; }

        /* TABLA ESTILO PROFESIONAL */
        .rubric-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 20px; }
        .rubric-table th { padding: 15px; text-align: left; color: var(--slate-700); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .rubric-table td { padding: 15px; background: var(--slate-50); border-top: 1px solid var(--slate-200); border-bottom: 1px solid var(--slate-200); transition: 0.2s; }
        .rubric-table td:first-child { border-left: 1px solid var(--slate-200); border-radius: 12px 0 0 12px; font-weight: 700; width: 200px; color: var(--brand); }
        .rubric-table td:last-child { border-right: 1px solid var(--slate-200); border-radius: 0 12px 12px 0; }
        
        .lvl { cursor: pointer; font-size: 0.85rem; color: #64748b; line-height: 1.4; border: 2px solid transparent !important; }
        .lvl.selected { background: var(--brand-light) !important; border-color: var(--brand) !important; color: var(--brand-dark); font-weight: 600; }

        /* GRÁFICOS DASHBOARD (SIDEBAR) */
        .chart-container { position: relative; width: 180px; height: 180px; margin: 20px 0; }
        .circular-chart { display: block; margin: 10px auto; max-width: 100%; max-height: 250px; }
        .circle-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 2.8; }
        .circle { fill: none; stroke: var(--brand); stroke-width: 2.8; stroke-linecap: round; transition: stroke-dasharray 0.6s ease; }
        .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 800; color: white; }
        
        .desglose-list { width: 100%; margin-top: 30px; }
        .stat-item { margin-bottom: 15px; }
        .stat-label { font-size: 0.75rem; opacity: 0.7; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .bar-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--brand); width: 0%; transition: width 0.6s ease; }

        .mined-tag { padding: 8px 20px; border-radius: 50px; font-weight: 800; font-size: 0.8rem; margin-top: 10px; }

        @media print { .sidebar, .no-print { display: none !important; } .app-shell { display: block; } }
    </style>
</head>
<body>

<div id="setupScreen" class="setup-screen">
    <div class="card" style="text-align:center;">
        <h1 style="color:var(--brand); font-size:2.2rem;">RubricApp</h1>
        <p>Dashboard de Evaluación Inteligente</p>
    </div>

    <div class="card">
        <label><b>Configuración de Registro</b></label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
            <input type="text" id="cfgSubject" class="form-input" placeholder="Asignatura">
            <input type="text" id="cfgTitle" class="form-input" placeholder="Actividad">
        </div>
        <textarea id="cfgStudents" class="form-input" placeholder="Lista de Estudiantes (uno por línea)..."></textarea>
        <textarea id="cfgData" class="form-input" placeholder="Pega la Rúbrica desde Excel o ChatGPT..."></textarea>
        <button onclick="initDashboard()" class="btn-main" style="margin-top:15px;">Generar Dashboard de Clase</button>
    </div>
</div>

<div id="rubricScreen" class="rubric-screen">
    <div class="app-shell">
        <div class="main-panel">
            <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <div>
                    <h2 id="outTitle" style="color:var(--brand)"></h2>
                    <p id="outSubject" style="opacity:0.6; font-weight:600;"></p>
                </div>
                <div class="no-print">
                    <button onclick="nav(-1)" class="btn-main" style="width:auto; padding:10px 20px; font-size:0.8rem;">Anterior</button>
                    <button onclick="nav(1)" class="btn-main" style="width:auto; padding:10px 20px; font-size:0.8rem;">Siguiente</button>
                </div>
            </header>

            <h3 id="curStudent" style="margin-bottom:15px; font-size:1.4rem;"></h3>
            <table class="rubric-table">
                <thead id="rubThead"></thead>
                <tbody id="rubTbody"></tbody>
            </table>

            <div style="margin-top:40px;" class="no-print">
                <button onclick="window.print()" class="btn-main" style="width:auto; background:var(--slate-700);">🖨️ Imprimir Acta PDF</button>
                <!-- <button onclick="exportCSV()" class="btn-main" style="width:auto; background:#10b981; margin-left:10px;">📊 Exportar Excel</button> -->
            </div>
        </div>

        <div class="sidebar no-print">
            <h4 style="letter-spacing:2px; font-size:0.7rem; opacity:0.5;">EVALUACIÓN FINAL</h4>
            
            <div class="chart-container">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="circleProgress" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div id="bigNota" class="percentage">0</div>
            </div>

            <div id="minedTag" class="mined-tag">SIN EVALUAR</div>

            <div class="desglose-list" id="desgloseList">
                </div>

            <div style="margin-top:auto; font-size:0.7rem; opacity:0.4; text-align:center;">
                Evaluación Educativa<br>Dashboard Inteligente
            </div>
        </div>
    </div>
</div>

<script>
    let students = [], currentIndex = 0, rubricRows = [], rubricHeaders = [], scores = {};

    function initDashboard() {
        const raw = document.getElementById('cfgData').value.trim();
        const stud = document.getElementById('cfgStudents').value.trim();
        if(!raw || !stud) return alert("Faltan datos");

        students = stud.split('\n').filter(s => s.trim() !== "");
        const lines = raw.split('\n');
        let sep = lines[0].includes("|") ? "|" : (lines[0].includes(";") ? ";" : "\t");
        rubricHeaders = lines[0].split(sep).map(h => h.trim());
        rubricRows = lines.slice(1).map(l => l.split(sep).map(c => c.trim()));

        document.getElementById('outTitle').textContent = document.getElementById('cfgTitle').value;
        document.getElementById('outSubject').textContent = document.getElementById('cfgSubject').value;

        renderTable();
        showStudent(0);
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('rubricScreen').style.display = 'block';
    }

    function renderTable() {
        let head = `<tr><th>Indicador</th>` + rubricHeaders.slice(1).map(h => `<th>${h}</th>`).join('') + `</tr>`;
        document.getElementById('rubThead').innerHTML = head;
        
        let body = rubricRows.map((row, rIdx) => {
            let cells = row.slice(1).map((c, cIdx) => {
                let pts = Math.round(100 - (cIdx * (100 / (rubricHeaders.length - 2))));
                return `<td class="lvl" data-r="${rIdx}" data-p="${pts}" onclick="selectLvl(${rIdx}, ${pts}, this)">${c}</td>`;
            }).join('');
            return `<tr><td>${row[0]}</td>${cells}</tr>`;
        }).join('');
        document.getElementById('rubTbody').innerHTML = body;

        // Crear esqueletos de barras en el sidebar
        document.getElementById('desgloseList').innerHTML = rubricRows.map((row, i) => `
            <div class="stat-item">
                <div class="stat-label"><span>${row[0]}</span><span id="barVal${i}">0%</span></div>
                <div class="bar-bg"><div id="barFill${i}" class="bar-fill"></div></div>
            </div>
        `).join('');
    }

    function selectLvl(rIdx, pts, el) {
        el.parentElement.querySelectorAll('.lvl').forEach(td => td.classList.remove('selected'));
        el.classList.add('selected');
        if(!scores[currentIndex]) scores[currentIndex] = {};
        scores[currentIndex][rIdx] = pts;
        updateDashboard();
    }

    function updateDashboard() {
        const s = scores[currentIndex] ? Object.values(scores[currentIndex]) : [];
        const final = s.length > 0 ? Math.round(s.reduce((a,b)=>a+b, 0) / rubricRows.length) : 0;
        
        // Anillo y Nota
        document.getElementById('bigNota').textContent = final;
        document.getElementById('circleProgress').setAttribute('stroke-dasharray', `${final}, 100`);
        
        // Colores según nota
        let color = "#ef4444", txt = "AI - INICIAL";
        if(final >= 90) { color = "#10b981"; txt = "AA - ALCANZADO"; }
        else if(final >= 76) { color = "#3b82f6"; txt = "AS - SATISFACTORIO"; }
        else if(final >= 60) { color = "#f59e0b"; txt = "AF - EN PROCESO"; }
        
        document.getElementById('circleProgress').style.stroke = color;
        const tag = document.getElementById('minedTag');
        tag.textContent = txt;
        tag.style.background = color;
        tag.style.color = "white";

        // Barras laterales
        rubricRows.forEach((_, i) => {
            let p = (scores[currentIndex] && scores[currentIndex][i]) ? scores[currentIndex][i] : 0;
            document.getElementById(`barFill${i}`).style.width = p + "%";
            document.getElementById(`barFill${i}`).style.background = color;
            document.getElementById(`barVal${i}`).textContent = p + "%";
        });
    }

    function showStudent(idx) {
        currentIndex = idx;
        document.getElementById('curStudent').textContent = students[idx];
        document.querySelectorAll('.lvl').forEach(td => td.classList.remove('selected'));
        if(scores[currentIndex]) {
            Object.entries(scores[currentIndex]).forEach(([r, p]) => {
                const rowCells = document.getElementById('rubTbody').rows[r].querySelectorAll('.lvl');
                rowCells.forEach(td => { if(parseInt(td.dataset.p) === p) td.classList.add('selected'); });
            });
        }
        updateDashboard();
    }

    function nav(dir) {
        let n = currentIndex + dir;
        if(n >= 0 && n < students.length) showStudent(n);
    }
</script>
</body>
</html>
